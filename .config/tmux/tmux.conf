set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable focus events for vim autoread
set -g focus-events on
# Fix Vim ESC delay
set -sg escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

set -ga terminal-overrides ',xterm-256color:Tc'
# Add '-xterm' to the back of the name for xterm256 compatibility
# E.g. 'dark-medium-xterm'
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @ukiyo-theme "kanagawa/wave"    # default dark
set -g @ukiyo-plugins "git battery"

set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @plugin 'accessd/tmux-agent-indicator'
set -g @plugin 'trevarj/tmux-open-nvim'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key F
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# status bar
#set -g status-right '#{agent_indicator} | %H:%M'

